services:
  - type: web
    name: geowaste-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm install --legacy-peer-deps && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Database configuration - set these in Render dashboard
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Frontend URL
      - key: CORS_ORIGIN
        value: https://geowastekilifi.rashoti.com
      # API configuration
      - key: API_BASE_URL
        value: https://geowastekilifiproject.onrender.com/api
      - key: API_VERSION
        value: v1
      # Cloudinary - set in Render dashboard
      - key: CLOUDINARY_URL
        sync: false
      # Email service - set in Render dashboard
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
